<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Short-Key P2P Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --text-muted: #888888;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--panel-color);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 450px;
            max-width: 90%;
        }

        .hidden { display: none !important; }
        h2 { margin-top: 0; color: var(--accent-color); }
        
        label {
            display: block;
            margin: 15px 0 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: #008c95; }
        button.secondary { background-color: #444; }
        button.secondary:hover { background-color: #555; }
        button.danger { background-color: #d9534f; }
        button.danger:hover { background-color: #c9302c; }

        #chat-box {
            height: 300px;
            border: 1px solid #444;
            background: #151515;
            border-radius: 6px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 80%; line-height: 1.4; }
        .msg.me { background: var(--accent-color); margin-left: auto; text-align: right; color: white; }
        .msg.peer { background: #333; margin-right: auto; }
        .msg.system { background: #222; color: var(--text-muted); margin: 5px auto; text-align: center; font-size: 0.8rem; max-width: 100%; }

        #chat-input-area { display: flex; gap: 10px; }
        #chat-input-area input { flex-grow: 1; text-align: left; font-size: 1rem; letter-spacing: normal; }
        #chat-input-area button { width: auto; margin: 0; }
        
        .status-bar { font-size: 0.85rem; color: var(--text-muted); margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h2>Private P2P Chat</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Connect securely using a disposable 8-character key.</p>
        <button id="btn-create-mode">Generate Disposable Key</button>
        <button id="btn-join-mode" class="secondary">Enter Existing Key</button>
    </div>

    <div id="host-screen" class="hidden">
        <h2>Your Disposable Key</h2>
        <label>Share this key with your peer to connect:</label>
        <input type="text" id="generated-key" readonly onclick="this.select()">
        <p class="status-bar" id="host-status">Waiting for peer to enter key...</p>
    </div>

    <div id="join-screen" class="hidden">
        <h2>Enter Key</h2>
        <label>Paste or type the 8-character key:</label>
        <input type="text" id="input-key" placeholder="XXXXXXXX" maxlength="8">
        <button id="btn-connect-join">Connect to Peer</button>
        <p class="status-bar" id="join-status"></p>
    </div>

    <div id="chat-screen" class="hidden">
        <h2>Secure Chat Room</h2>
        <div id="chat-box"></div>
        <div id="chat-input-area">
            <input type="text" id="msg-input" placeholder="Type a private message..." autocomplete="off">
            <button id="btn-send">Send</button>
        </div>
        <button id="btn-end-chat" class="danger">End Chat (0/2 Votes)</button>
        <div id="status-text" class="status-bar">Connected via end-to-end P2P.</div>
    </div>
</div>

<script>
    let peer = null;
    let conn = null;
    let disconnectVoted = false;
    let peerDisconnectVoted = false;

    // DOM Screens
    const startScreen = document.getElementById('start-screen');
    const hostScreen = document.getElementById('host-screen');
    const joinScreen = document.getElementById('join-screen');
    const chatScreen = document.getElementById('chat-screen');

    // Helper: Generate random 8-character alphanumeric key
    function generateShortKey() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 8; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    // --- Host Mode ---
    document.getElementById('btn-create-mode').onclick = () => {
        startScreen.classList.add('hidden');
        hostScreen.classList.remove('hidden');
        
        const shortKey = generateShortKey();
        document.getElementById('generated-key').value = shortKey;

        // Initialize PeerJS broker server room using our custom 8-character ID
        peer = new Peer(shortKey);

        peer.on('open', (id) => {
            document.getElementById('host-status').innerText = "Key active. Waiting for peer...";
        });

        // Listen for the incoming connection from the joiner
        peer.on('connection', (connection) => {
            conn = connection;
            setupDataChannel();
        });

        peer.on('error', (err) => {
            alert("Error creating room. Try generating a new key.");
            window.location.reload();
        });
    };

    // --- Join Mode ---
    document.getElementById('btn-join-mode').onclick = () => {
        startScreen.classList.add('hidden');
        joinScreen.classList.remove('hidden');
    };

    document.getElementById('btn-connect-join').onclick = () => {
        const targetKey = document.getElementById('input-key').value.trim().toUpperCase();
        if (targetKey.length !== 8) return alert("Key must be exactly 8 characters.");

        document.getElementById('join-status').innerText = "Connecting...";

        // Create a random identity for ourselves, then connect to the host's 8-character key
        peer = new Peer();
        
        peer.on('open', () => {
            conn = peer.connect(targetKey);
            setupDataChannel();
        });

        peer.on('error', (err) => {
            document.getElementById('join-status').innerText = "Failed to connect. Verify the key.";
        });
    };

    // --- Universal Data Channel Logic ---
    function setupDataChannel() {
        conn.on('open', () => {
            // Switch views to the active chat UI
            hostScreen.classList.add('hidden');
            joinScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            appendSystemMessage("Secure End-to-End Connection Established.");
        });

        conn.on('data', (data) => {
            if (data.type === 'msg') {
                appendMessage(data.value, 'peer');
            } else if (data.type === 'signal-disconnect') {
                peerDisconnectVoted = true;
                updateDisconnectUI();
                appendSystemMessage("Peer voted to end the chat.");
                checkMutualDisconnect();
            }
        });

        conn.on('close', () => {
            appendSystemMessage("Connection severed.");
            disableChat();
        });
    }

    // --- Messaging Functionality ---
    function appendMessage(text, side) {
        const box = document.getElementById('chat-box');
        const el = document.createElement('div');
        el.className = `msg ${side}`;
        el.innerText = text;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    function appendSystemMessage(text) {
        const box = document.getElementById('chat-box');
        const el = document.createElement('div');
        el.className = 'msg system';
        el.innerText = text;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const val = input.value.trim();
        if (!val || !conn) return;
        
        conn.send({ type: 'msg', value: val });
        appendMessage(val, 'me');
        input.value = '';
    }

    document.getElementById('btn-send').onclick = sendMessage;
    document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    // --- Mutual Disconnect Logic (2/2 Votes) ---
    const endBtn = document.getElementById('btn-end-chat');
    
    endBtn.onclick = () => {
        if (!disconnectVoted) {
            disconnectVoted = true;
            updateDisconnectUI();
            appendSystemMessage("You voted to end the chat. Waiting for your peer...");
            
            if (conn) {
                conn.send({ type: 'signal-disconnect' });
            }
            checkMutualDisconnect();
        }
    };

    function updateDisconnectUI() {
        let votes = 0;
        if (disconnectVoted) votes++;
        if (peerDisconnectVoted) votes++;
        endBtn.innerText = `End Chat (${votes}/2 Votes)`;
        if (disconnectVoted) {
            endBtn.classList.remove('danger');
            endBtn.classList.add('secondary');
        }
    }

    function checkMutualDisconnect() {
        if (disconnectVoted && peerDisconnectVoted) {
            appendSystemMessage("Both parties agreed. Closing chat safely...");
            setTimeout(() => {
                if(conn) conn.close();
                if(peer) peer.destroy();
                disableChat();
            }, 1000);
        }
    }

    function disableChat() {
        document.getElementById('msg-input').disabled = true;
        document.getElementById('btn-send').disabled = true;
        endBtn.disabled = true;
        document.getElementById('status-text').innerText = "Chat terminated securely.";
    }
</script>
</body>
</html>
